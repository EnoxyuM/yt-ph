<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Preview Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #loading {
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 18px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #error {
            color: #ff4444;
            font-family: Arial, sans-serif;
            font-size: 14px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="loading">Loading video...</div>
        <div id="error">Video unavailable</div>
        <iframe 
            id="youtube-player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            style="display: none;">
        </iframe>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        
        const player = document.getElementById('youtube-player');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        
        if (!videoId) {
            loading.style.display = 'none';
            error.textContent = 'No video ID provided';
            error.style.display = 'block';
        } else {
            // Стандартный YouTube embed URL
            player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&rel=0&modestbranding=1`;
            
            player.onload = function() {
                loading.style.display = 'none';
                player.style.display = 'block';
            };
            
            player.onerror = function() {
                loading.style.display = 'none';
                error.style.display = 'block';
            };
            
            // Таймаут на случай если видео не загрузится
            setTimeout(() => {
                if (loading.style.display !== 'none') {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                }
            }, 10000);
        }
        
        // Обработка сообщений от родительского окна (для управления плеером)
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'yt-preview-command') {
                switch(event.data.command) {
                    case 'pause':
                        // Можно добавить управление через YouTube IFrame API если нужно
                        break;
                    case 'stop':
                        player.src = 'about:blank';
                        break;
                }
            }
        });
    </script>
</body>
</html>
