<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #player-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            /* Сдвигаем iframe чтобы скрыть верхний UI */
            margin-top: -30px;
            height: calc(100% + 30px);
        }
        
        /* CSS хаки для скрытия YouTube UI элементов */
        iframe {
            position: relative;
        }
        
        /* Скрываем субтитры и другие UI элементы через CSS */
        ::part(ytp-caption-window-container),
        .ytp-caption-window-container,
        .caption-window,
        .captions-text {
            display: none !important;
            visibility: hidden !important;
        }
        
        #volume-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        
        #volume-indicator.visible {
            opacity: 1;
        }
        
        /* Overlay для блокировки YouTube UI */
        #ui-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px; /* Блокируем верхние 40px где может быть UI */
            z-index: 999;
            pointer-events: none; /* Пропускаем клики к iframe */
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="youtube-player"></div>
        <div id="ui-blocker"></div>
        <div id="volume-indicator">🔊 5%</div>
    </div>

    <script>
        // Загружаем YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        
        let player = null;
        let playerReady = false;
        let currentVolume = 5;
        let volumeIndicatorTimeout = null;

        function onYouTubeIframeAPIReady() {
            if (!videoId) return;
            
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                width: '100%',
                height: '100%',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0,
                    'rel': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'disablekb': 1,
                    'playsinline': 1,
                    'cc_load_policy': 0,
                    'cc_lang_pref': 'en',
                    'autohide': 1,
                    'loop': 1,
                    'playlist': videoId,
                    'theme': 'dark',
                    'color': 'red',
                    'hl': 'en',
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            playerReady = true;
            
            // Пытаемся отключить субтитры через API
            try {
                if (player.getOption && player.getOption('captions', 'track')) {
                    player.setOption('captions', 'track', {languageCode: ''});
                }
            } catch (e) {}
            
            try {
                event.target.setVolume(currentVolume);
                event.target.unMute();
                event.target.playVideo();
            } catch (e) {
                event.target.mute();
                event.target.playVideo();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (player.isMuted && player.isMuted()) {
                    try {
                        player.setVolume(currentVolume);
                        player.unMute();
                    } catch (e) {}
                }
            }
        }

        function showVolumeIndicator() {
            const volumeIndicator = document.getElementById('volume-indicator');
            volumeIndicator.textContent = currentVolume > 0 ? `🔊 ${currentVolume}%` : '🔇 0%';
            volumeIndicator.classList.add('visible');
            
            clearTimeout(volumeIndicatorTimeout);
            volumeIndicatorTimeout = setTimeout(() => {
                volumeIndicator.classList.remove('visible');
            }, 1500);
        }

        // Слушаем wheel и отправляем родителю
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'yt-preview-wheel',
                    deltaY: e.deltaY
                }, '*');
            }
        }, { passive: false });

        // Слушаем команды от родителя
        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'yt-preview-command') return;
            
            const command = event.data.command;
            
            switch (command) {
                case 'setVolume':
                    const newVolume = Math.max(0, Math.min(100, event.data.volume));
                    currentVolume = newVolume;
                    
                    if (player && playerReady) {
                        player.setVolume(currentVolume);
                        if (currentVolume > 0) {
                            player.unMute();
                        } else {
                            player.mute();
                        }
                    }
                    showVolumeIndicator();
                    break;
                    
                case 'stop':
                    if (player && playerReady) {
                        player.stopVideo();
                    }
                    break;
                    
                case 'disableSubtitles':
                    // Пытаемся отключить субтитры
                    if (player && playerReady) {
                        try {
                            player.unloadModule('captions');
                        } catch (e) {}
                        try {
                            player.setOption('captions', 'reload', false);
                        } catch (e) {}
                        try {
                            player.setOption('captions', 'track', {languageCode: ''});
                        } catch (e) {}
                    }
                    break;
            }
        });

        // Блокируем прокрутку
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
