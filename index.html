<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

#wrap{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
}

/* YouTube iframe увеличен и сдвинут — обрезает ВСЕ UI элементы */
#youtube-player{
  position:absolute;
  top:-80px;
  left:0;
  width:100%;
  height:calc(100% + 160px);
}
#youtube-player iframe{
  width:100%!important;
  height:100%!important;
}

/* Прозрачный overlay ПОВЕРХ youtube iframe — перехватывает wheel */
#wheel-catcher{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  z-index:9999;
  background:transparent;
}

#vol{
  position:absolute;
  bottom:8px;right:8px;
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:4px 10px;
  border-radius:4px;
  font:bold 15px Arial;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  z-index:10000;
}
#vol.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="youtube-player"></div>
  <div id="wheel-catcher"></div>
  <div id="vol">5%</div>
</div>
<script>
var tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

var vid=new URLSearchParams(location.search).get('v');
var player,ready=false,vol=5,volTimer=null;

function onYouTubeIframeAPIReady(){
  if(!vid)return;
  player=new YT.Player('youtube-player',{
    videoId:vid,
    width:'100%',
    height:'100%',
    playerVars:{
      autoplay:1,
      mute:1,
      controls:0,
      rel:0,
      modestbranding:1,
      iv_load_policy:3,
      fs:0,
      disablekb:1,
      playsinline:1,
      cc_load_policy:0,
      loop:1,
      playlist:vid
    },
    events:{
      onReady:function(e){
        ready=true;
        try{
          e.target.setVolume(vol);
          e.target.unMute();
          e.target.playVideo();
        }catch(x){
          e.target.mute();
          e.target.playVideo();
        }
        // Убиваем субтитры
        killCaptions();
      },
      onStateChange:function(e){
        if(e.data===YT.PlayerState.PLAYING){
          killCaptions();
          if(player.isMuted&&player.isMuted()){
            try{player.setVolume(vol);player.unMute();}catch(x){}
          }
        }
      }
    }
  });
}

function killCaptions(){
  if(!player||!ready)return;
  try{player.unloadModule('captions');}catch(x){}
  try{player.unloadModule('cc');}catch(x){}
  try{player.setOption('captions','track',{languageCode:''});}catch(x){}
  try{player.setOption('captions','reload',false);}catch(x){}
  try{player.setOption('cc','track',{languageCode:''});}catch(x){}
}

function showVol(){
  var el=document.getElementById('vol');
  el.textContent=vol>0?vol+'%':'0%';
  el.classList.add('show');
  clearTimeout(volTimer);
  volTimer=setTimeout(function(){el.classList.remove('show');},1200);
}

// === WHEEL: прозрачный overlay перехватывает ВСЕ wheel события ===
document.getElementById('wheel-catcher').addEventListener('wheel',function(e){
  e.preventDefault();
  e.stopPropagation();

  // Отправляем родителю (userscript на youtube.com)
  if(window.parent!==window){
    window.parent.postMessage({type:'yt-wheel',d:e.deltaY},'*');
  }
},{passive:false,capture:true});

// Блокируем любые другие прокрутки
document.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

// === Приём команд от userscript ===
window.addEventListener('message',function(e){
  if(!e.data)return;

  if(e.data.type==='yt-cmd'){
    if(e.data.cmd==='vol'){
      vol=Math.max(0,Math.min(100,e.data.v));
      if(player&&ready){
        player.setVolume(vol);
        vol>0?player.unMute():player.mute();
      }
      showVol();
    }
    if(e.data.cmd==='stop'){
      if(player&&ready)player.stopVideo();
    }
    if(e.data.cmd==='nocap'){
      killCaptions();
    }
  }
});
</script>
</body>
</html>
