<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Previewы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #player-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        #volume-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        
        #volume-indicator.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="youtube-player"></div>
        <div id="volume-indicator">🔊 5%</div>
    </div>

    <script>
        // Загружаем YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        
        let player = null;
        let playerReady = false;
        let currentVolume = 5;
        let volumeIndicatorTimeout = null;

        // Функция вызывается когда YouTube IFrame API готов
        function onYouTubeIframeAPIReady() {
            if (!videoId) return;
            
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                width: '100%',
                height: '100%',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0,              // Убираем все контролы
                    'rel': 0,                   // Без похожих видео
                    'showinfo': 0,              // Без информации
                    'modestbranding': 1,        // Минимальный логотип
                    'iv_load_policy': 3,        // Без аннотаций
                    'fs': 0,                    // Без fullscreen
                    'disablekb': 1,             // Без клавиатуры
                    'playsinline': 1,
                    'cc_load_policy': 0,        // Без субтитров
                    'cc_lang_pref': 'en',
                    'autohide': 1,              // Автоскрытие контролов
                    'loop': 1,
                    'playlist': videoId,
                    'theme': 'dark',
                    'color': 'red',
                    'hl': 'en'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            playerReady = true;
            try {
                event.target.setVolume(currentVolume);
                event.target.unMute();
                event.target.playVideo();
            } catch (e) {
                event.target.mute();
                event.target.playVideo();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (player.isMuted && player.isMuted()) {
                    try {
                        player.setVolume(currentVolume);
                        player.unMute();
                    } catch (e) {}
                }
            }
        }

        // Показ индикатора громкости
        function showVolumeIndicator() {
            const volumeIndicator = document.getElementById('volume-indicator');
            volumeIndicator.textContent = currentVolume > 0 ? `🔊 ${currentVolume}%` : '🔇 0%';
            volumeIndicator.classList.add('visible');
            
            clearTimeout(volumeIndicatorTimeout);
            volumeIndicatorTimeout = setTimeout(() => {
                volumeIndicator.classList.remove('visible');
            }, 1500);
        }

        // Локальный wheel listener - отправляет сообщение родителю
        document.getElementById('player-container').addEventListener('wheel', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Отправляем wheel event родителю
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'yt-preview-wheel',
                    deltaY: e.deltaY
                }, '*');
            }
            
            return false;
        }, { passive: false });

        // Принимаем команды от родителя
        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'yt-preview-command') return;
            
            const command = event.data.command;
            
            switch (command) {
                case 'setVolume':
                    const newVolume = Math.max(0, Math.min(100, event.data.volume));
                    currentVolume = newVolume;
                    
                    if (player && playerReady) {
                        player.setVolume(currentVolume);
                        if (currentVolume > 0) {
                            player.unMute();
                        } else {
                            player.mute();
                        }
                    }
                    showVolumeIndicator();
                    break;
                    
                case 'stop':
                    if (player && playerReady) {
                        player.stopVideo();
                    }
                    break;
            }
        });

        // Предотвращаем любые попытки прокрутки
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
